<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plandex Agent Interface</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .controls { display: flex; gap: 20px; margin-bottom: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        #chat-window { width: 80%; height: 400px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; margin-bottom: 20px; }
        #input-area { display: flex; width: 80%; gap: 10px; }
        #user-input { flex-grow: 1; padding: 10px; }
        .message { margin: 5px 0; }
        .user-msg { color: blue; }
        .agent-msg { color: green; }
        .system-msg { color: gray; font-style: italic; }

        /* Modal Styles */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 5px; width: 50%; display: flex; flex-direction: column; gap: 15px; }
        .modal-content input { padding: 8px; font-size: 14px; width: 100%; box-sizing: border-box; }
        .status-badge { font-weight: bold; margin-left: 10px; font-size: 0.9em; }
        .set { color: green; }
        .not-set { color: red; }
        .setting-row { display: flex; flex-direction: column; gap: 5px; }
        .setting-header { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <h1>Plandex Agent Interface</h1>

    <div class="controls">
        <button onclick="startChat('data')">Start Data Chat</button>
        <button onclick="startChat('powerbi')">Start Power BI Chat</button>
        <button onclick="syncDatabase()">Synchronize DB Metadata</button>
        <button onclick="openSettings()">⚙️ Settings</button>
    </div>

    <div id="chat-window"></div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h2>Environment Settings</h2>
            <p style="font-size: 0.9em; color: #666;">These settings override environment variables for the current session.</p>

            <div class="setting-row">
                <div class="setting-header">
                    <label>Blablador API Key:</label>
                    <span id="status-blablador" class="status-badge">Checking...</span>
                </div>
                <input type="password" id="input-blablador" placeholder="Enter new value">
            </div>

            <div class="setting-row">
                <div class="setting-header">
                    <label>Azure SQL Connection String:</label>
                    <span id="status-azuresql" class="status-badge">Checking...</span>
                </div>
                <input type="text" id="input-azuresql" placeholder="Server=tcp:...;User ID=...;Password=...">
            </div>

            <div class="setting-row">
                <div class="setting-header">
                    <label>Power BI Client ID:</label>
                    <span id="status-powerbi" class="status-badge">Checking...</span>
                </div>
                <input type="text" id="input-powerbi" placeholder="Enter new value">
            </div>

            <div class="setting-row">
                <div class="setting-header">
                    <label>OpenAI API Key (Fallback):</label>
                    <span id="status-openai" class="status-badge">Checking...</span>
                </div>
                <input type="password" id="input-openai" placeholder="Enter new value">
            </div>

            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px;">
                <button onclick="saveSettings()">Save & Refresh</button>
                <button onclick="closeSettings()">Close</button>
            </div>
        </div>
    </div>

    <script>
        let currentMode = null;

        function appendMessage(sender, text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.textContent = `${sender}: ${text}`;
            document.getElementById('chat-window').appendChild(div);
            document.getElementById('chat-window').scrollTop = document.getElementById('chat-window').scrollHeight;
        }

        async function startChat(mode) {
            currentMode = mode;
            document.getElementById('chat-window').innerHTML = '';
            appendMessage('System', `Starting chat in ${mode} mode...`, 'system-msg');

            if (mode === 'data') {
                appendMessage('Agent', 'I am ready to help you with Database queries. I can access the WhoDB schema.', 'agent-msg');
            } else {
                appendMessage('Agent', 'I am ready to help you with Power BI reports.', 'agent-msg');
            }
        }

        async function syncDatabase() {
            appendMessage('System', 'Synchronizing database metadata...', 'system-msg');
            try {
                const response = await fetch('/api/sync_metadata', { method: 'POST' });
                const result = await response.json();
                if (response.ok) {
                    appendMessage('System', `Sync complete: ${result.message}`, 'system-msg');
                } else {
                    appendMessage('System', `Sync failed: ${result.error}`, 'system-msg');
                }
            } catch (e) {
                appendMessage('System', `Sync error: ${e.message}`, 'system-msg');
            }
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            appendMessage('You', text, 'user-msg');
            input.value = '';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, mode: currentMode })
                });
                const result = await response.json();
                appendMessage('Agent', result.reply, 'agent-msg');
            } catch (e) {
                appendMessage('System', `Error: ${e.message}`, 'system-msg');
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function openSettings() {
            document.getElementById('settings-modal').style.display = 'flex';
            checkSettingsStatus();
        }

        function closeSettings() {
            document.getElementById('settings-modal').style.display = 'none';
        }

        async function checkSettingsStatus() {
            try {
                const res = await fetch('/api/settings_status');
                const data = await res.json();
                updateStatus('status-blablador', data.BLABLADOR_API_KEY);
                updateStatus('status-azuresql', data.AZURE_SQL_CONNECTION_STRING);
                updateStatus('status-powerbi', data.POWERBI_CLIENT_ID);
                updateStatus('status-openai', data.OPENAI_API_KEY);
            } catch (e) {
                console.error("Failed to fetch settings status", e);
            }
        }

        function updateStatus(id, val) {
            const el = document.getElementById(id);
            if (el) {
                el.textContent = val;
                el.className = 'status-badge ' + (val === 'NOT SET' ? 'not-set' : 'set');
            }
        }

        async function saveSettings() {
            const updates = {
                "BLABLADOR_API_KEY": document.getElementById('input-blablador').value,
                "AZURE_SQL_CONNECTION_STRING": document.getElementById('input-azuresql').value,
                "POWERBI_CLIENT_ID": document.getElementById('input-powerbi').value,
                "OPENAI_API_KEY": document.getElementById('input-openai').value
            };

            try {
                const res = await fetch('/api/settings_update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updates)
                });
                const data = await res.json();
                alert(data.message);
                checkSettingsStatus();

                // Clear inputs after successful save
                document.querySelectorAll('.modal-content input').forEach(i => i.value = '');
            } catch (e) {
                alert("Failed to update settings: " + e.message);
            }
        }
    </script>
</body>
</html>
