[supervisord]
nodaemon=true
user=root

[program:postgresql]
command=/usr/lib/postgresql/14/bin/postgres -D /etc/postgresql/14/main/ -c config_file=/etc/postgresql/14/main/postgresql.conf
user=postgres
autorestart=true

[program:whodb-mcp]
# Expose .NET stdio over TCP 8080 using socat
command=socat TCP-LISTEN:8080,fork,bind=127.0.0.1 EXEC:"dotnet /app/bin/whodb/WhoDbMcp.dll"
directory=/app/bin/whodb
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:plandex-server]
# Wait for DB (simple sleep for now, or use a wait-for-it script in CMD)
command=/bin/bash -c "sleep 5 && /app/bin/plandex-server"
directory=/app/src/server
environment=MCP_WHODB_HOST="127.0.0.1:8080",DATABASE_URL="postgres://plandex:plandex@127.0.0.1:5432/plandex?sslmode=disable"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
