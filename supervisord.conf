[supervisord]
nodaemon=true
user=root

[program:postgresql]
command=/usr/lib/postgresql/14/bin/postgres -D /etc/postgresql/14/main/ -c config_file=/etc/postgresql/14/main/postgresql.conf
user=postgres
autorestart=true

[program:sqlite-mcp]
# Expose Python MCP stdio over TCP 8081 using socat
# We run from /app/mcp-servers/sqlite-bridge so it can find metadata.db
command=socat TCP-LISTEN:8081,fork,bind=127.0.0.1 EXEC:"python3 /app/mcp-servers/sqlite-bridge/server.py"
directory=/app/mcp-servers/sqlite-bridge
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:plandex-server]
# Wait for DB
command=/bin/bash -c "sleep 5 && /app/bin/plandex-server"
directory=/app/src/server
# Set PORT=8080 for Plandex (external)
# Set MCP host to 8081 (internal bridge)
environment=PORT="8080",MCP_WHODB_HOST="127.0.0.1:8081",DATABASE_URL="postgres://plandex:plandex@127.0.0.1:5432/plandex?sslmode=disable"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
